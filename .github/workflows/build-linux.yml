name: Build Linux binary

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the binary to'
        required: true
        default: 'v2.0'
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system libs for PySide6
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install Python dependencies
        run: pip install PySide6 pyinstaller

      - name: Build
        run: |
          chmod +x build_linux.sh
          ./build_linux.sh

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/MIB2_Converter_v2
